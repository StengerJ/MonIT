<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>MonIT - Overview</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        .status-ONLINE { color: green; font-weight: bold; }
        .status-WARNING { color: #b58900; font-weight: bold; }
        .status-OFFLINE { color: red; font-weight: bold; }
    </style>
</head>
<body>
<h1>MonIT - Client Overview</h1>
<p><a href="/settings/alerts">Alert recipient settings</a></p>
<table>
    <thead>
    <tr><th>Hostname</th><th>Status</th><th>Last Seen</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.hostname}">host</td>
        <td th:class="'status-' + ${client.status}" th:text="${client.status}">ONLINE</td>
        <td th:text="${client.lastSeen}">-</td>
        <td><a th:href="@{'/clients/' + ${client.id}}">details</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
