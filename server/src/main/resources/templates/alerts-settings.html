<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="color-scheme" content="dark"/>
    <title>MonIT — Alert routing</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml"/>
    <link rel="stylesheet" th:href="@{/css/monit.css}"/>
</head>
<body>
<div class="shell">
    <div th:replace="~{fragments/chrome :: topbar}"></div>

    <nav class="topnav" style="margin-bottom:16px;"><a href="/" class="back">Fleet</a></nav>

    <p class="eyebrow" style="margin-bottom:8px;">Global alert routing</p>

    <section class="panel">
        <p class="panel__title">Recipients notified for every host</p>
        <p class="muted-note">Each client can also have its own additional recipients from its detail page.</p>

        <div th:if="${not #lists.isEmpty(recipients)}">
            <div class="routing__row" th:each="recipient : ${recipients}">
                <span class="routing__email" th:text="${recipient.email}">email</span>
                <form th:action="@{'/settings/alerts/' + ${recipient.id} + '/delete'}" method="post">
                    <button type="submit" class="ghost-btn">Remove</button>
                </form>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(recipients)}" class="muted-note">No global recipients yet — alerts won't reach anyone until you add one.</p>

        <form action="/settings/alerts" method="post" class="routing__form">
            <input type="email" name="email" placeholder="admin@example.com" required="required"/>
            <button type="submit" class="solid-btn">Add</button>
        </form>
    </section>
</div>
</body>
</html>
